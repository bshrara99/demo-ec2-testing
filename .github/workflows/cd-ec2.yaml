name: CI/CD to EC2

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/accelerator-cd-demo:latest
      NAME: accelerator-cd-demo
      PORT: 8000

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE }}

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e
          IMAGE="${{ env.IMAGE }}"
          NAME="${{ env.NAME }}"
          PORT="${{ env.PORT }}"

          # Pull the latest image from DockerHub
          sudo docker pull "$IMAGE"

          # Stop & remove existing container if running
          if [ "$(sudo docker ps -aq -f name=^/${NAME}$)" ]; then
            sudo docker rm -f "$NAME" || true
          fi

          # Run fresh container
          sudo docker run -d \
            --name "$NAME" \
            --restart always \
            -p ${PORT}:${PORT} \
            "$IMAGE"

          # Print active containers for verification in Actions logs
          sudo docker ps